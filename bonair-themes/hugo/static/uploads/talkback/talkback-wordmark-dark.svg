<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="Talkback">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="38%" stop-color="#cfd2ff"/>
      <stop offset="52%" stop-color="#8b8ba3"/><stop offset="66%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E94560"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="120" fill="#0B0B14"/>
  <g font-family="Anton, Impact, sans-serif" font-size="76" letter-spacing="1">
    <text x="30" y="84" fill="url(#chrome)">TALK</text>
    <text x="212" y="84" fill="#E94560" filter="url(#glow)">BACK</text>
  </g>
  <g stroke="#E94560" stroke-width="3" stroke-linecap="round" opacity=".9">
    <line x1="424" y1="66" x2="424" y2="80"/><line x1="436" y1="52" x2="436" y2="94"/>
    <line x1="448" y1="40" x2="448" y2="106"/><line x1="460" y1="58" x2="460" y2="88"/>
    <line x1="472" y1="46" x2="472" y2="100"/>
  </g>
</svg>
